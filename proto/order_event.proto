syntax = "proto3";

package orderflow.v1;

option go_package = "github.com/ashi31/orderflow/gen/orderflowpb";

message OrderEvent {
  string event_id     = 1;
  string order_id     = 2;
  string event_type   = 3;
  int64  amount_minor = 4;
}

message SubmitEventRequest {
  OrderEvent event = 1;
}

message SubmitEventResponse {
  string event_id = 1;
  bool   accepted = 2;
}

service OrderEventService {
  rpc SubmitEvent(SubmitEventRequest) returns (SubmitEventResponse);
}




